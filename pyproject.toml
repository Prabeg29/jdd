[project]
name = "job-discovery"
version = "0.1.0"
description = "Personal job discovery pipeline: ATS ingestion, rule screening, LLM evaluation and a daily Slack digest."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.12.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.44.9",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]
