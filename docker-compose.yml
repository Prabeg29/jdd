# Local Postgres for development and integration tests only (production uses Neon).
# Host port 5433 avoids clashing with a system Postgres on 5432.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_discovery
    ports:
      - "127.0.0.1:${LOCAL_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_discovery"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
